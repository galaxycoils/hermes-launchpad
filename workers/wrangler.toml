name = "hermes-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "hermes-launchpad-db"
database_id = "afa984c4-30e5-4f47-afce-a401ee2df098"

[ai]
binding = "AI"

[vars]
PROGRAM_ID = "9K5eAWBkrUJbUiUC8aM6xeuXM2ACj9XNHfbC1X6Scjgz"
CLUSTER = "devnet"
GRADUATION_SOL = "85"
REQUIRE_SIGNED_TRADES = "true"
# Cloudflare Workers IPs are blocked by api.devnet.solana.com and rpcpool.
# Use Helius (add ?api-key=YOUR_KEY) or another keyed RPC that allows CF egress.
# SOLANA_RPC is managed via wrangler secrets (or defaults to Helius in worker.js)

