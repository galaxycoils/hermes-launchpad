name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  worker-check:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run worker deploy (syntax check)
        working-directory: workers
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "WORKER_CHECK_SKIPPED - no CF_API_TOKEN secret; intentionally skipped, not a false pass."
            exit 0
          fi
          npx wrangler@4 deploy --dry-run

  test-unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:unit

  test-worker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:worker

  test-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:client

  test-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:integration

  test-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:security

  test-program:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Install Solana CLI
        run: sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --locked
      - name: Run program tests if DEVNET_WALLET set
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /tmp/devnet-wallet.json
          DEVNET_WALLET: ${{ secrets.DEVNET_WALLET }}
        run: |
          if [ -z "$DEVNET_WALLET" ]; then
            echo "TEST_PROGRAM_SKIPPED - no DEVNET_WALLET secret; intentionally skipped, not a false pass."
            exit 0
          fi
          echo "$DEVNET_WALLET" > /tmp/devnet-wallet.json
          chmod 600 /tmp/devnet-wallet.json
          npm run test:program

  test-e2e:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npx playwright install --with-deps
      - name: Run E2E if DEVNET_WALLET set
        env:
          DEVNET_WALLET: ${{ secrets.DEVNET_WALLET }}
          DEVNET_RPC: https://api.devnet.solana.com
        run: |
          if [ -z "$DEVNET_WALLET" ]; then
            echo "TEST_E2E_SKIPPED - no DEVNET_WALLET secret; intentionally skipped, not a false pass."
            exit 0
          fi
          npm run test:e2e

  blocked-checks:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "CI gate active - lint/build/unit/worker/client/integration/security run on every PR. Program and E2E require DEVNET_WALLET secret."
