name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  worker-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run worker deploy (syntax check)
        working-directory: workers
        run: npx wrangler@4 deploy --dry-run

  test-unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:unit

  test-worker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:worker

  test-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:client

  test-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:integration

  test-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:security

  test-program:
    # Gated: requires DEVNET_WALLET secret (private key) to run on devnet.
    # Without the secret, this job is skipped (not a false fail).
    if: ${{ secrets.DEVNET_WALLET != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Install Solana CLI
        run: sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --locked
      - name: Write wallet keypair from secret
        run: |
          echo "${{ secrets.DEVNET_WALLET }}" > /tmp/devnet-wallet.json
          chmod 600 /tmp/devnet-wallet.json
      - run: npm run test:program
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /tmp/devnet-wallet.json

  test-e2e:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' && secrets.DEVNET_WALLET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
        env:
          DEVNET_WALLET: ${{ secrets.DEVNET_WALLET }}
          DEVNET_RPC: https://api.devnet.solana.com

  e2e-blocked-check:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' && secrets.DEVNET_WALLET == '' }}
    steps:
      - run: |
          echo "E2E_BLOCKED_WALLET_UNAVAILABLE: no DEVNET_WALLET secret - E2E intentionally skipped, not a false pass."

  test-program-blocked-check:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' && secrets.DEVNET_WALLET == '' }}
    steps:
      - run: |
          echo "TEST_PROGRAM_BLOCKED_WALLET_UNAVAILABLE: no DEVNET_WALLET secret - test-program intentionally skipped, not a false fail."

  lighthouse:
    # TRACKED WAIVER: runs against prod preview URL. Enforce hard PWA >= 90 once
    # preview-deploy is wired in WU-07 (plan release gate). Non-blocking until then.
    continue-on-error: true
    runs-on: ubuntu-22.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
      - name: Lighthouse CI (PWA target >= 90)
        run: |
          npx --yes @lhci/cli@0.13.x autorun \
            --collect.url=https://hermes-launchpad.pages.dev \
            --assert.assertions.categories:performance=minScore:0.90 \
            --assert.assertions.categories:accessibility=minScore:0.90 \
            --assert.assertions.categories:best-practices=minScore:0.90 \
            --assert.assertions.categories:seo=minScore:0.90 \
            --assert.assertions.categories:pwa=minScore:0.90