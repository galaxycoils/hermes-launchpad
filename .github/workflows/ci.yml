name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVNET_WALLET: ${{ secrets.DEVNET_WALLET }}

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  worker-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run worker deploy (syntax check)
        working-directory: workers
        run: npx wrangler@4 deploy --dry-run

  test-unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:unit

  test-worker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:worker

  test-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:client

  test-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:integration

  test-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run test:security

  test-program:
    if: ${{ env.DEVNET_WALLET != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Install Solana CLI
        run: sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --locked
      - name: Write wallet keypair from secret
        run: |
          echo "${{ secrets.DEVNET_WALLET }}" > /tmp/devnet-wallet.json
          chmod 600 /tmp/devnet-wallet.json
      - run: npm run test:program
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /tmp/devnet-wallet.json

  test-e2e:
    if: ${{ env.DEVNET_WALLET != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
        env:
          DEVNET_WALLET: ${{ secrets.DEVNET_WALLET }}
          DEVNET_RPC: https://api.devnet.solana.com

  blocked-checks:
    if: ${{ env.DEVNET_WALLET == '' }}
    runs-on: ubuntu-22.04
    steps:
      - run: echo "TEST_PROGRAM_AND_E2E_BLOCKED - no DEVNET_WALLET secret; intentionally skipped, not a false pass."
